[package]
name = "devdock"
version = "0.1.0"
edition = "2021"
description = "Windows project and agent activity dashboard"
default-run = "devdock"

[lib]
name = "devdock_core"
path = "src/lib.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [], optional = true }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
chrono = { version = "=0.4.44", features = ["serde"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
tokio = { version = "=1.52.0", features = ["full"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "=1.23.0", features = ["v4"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "devdock"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "devdock-cli"
path = "src/bin/devdock-cli.rs"

[dev-dependencies]
tempfile = "3"
